[project]
name = "govee-monitor"
version = "0.1.0"
description = "Govee H5055 BLE -> Artisan coffee-roasting temperature bridge for native Windows Python"
readme = "README.md"  # English; 中文见 README.zh-CN.md
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "bleak>=0.22",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
govee-monitor = "govee_monitor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["govee_monitor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
